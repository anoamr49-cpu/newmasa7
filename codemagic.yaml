workflows:
  android-check:
    name: Android Check
    instance_type: mac_mini_m2
    environment:
      flutter: 3.44.7
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: Build debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cd ..
          mkdir -p build/app/outputs/flutter-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk build/app/outputs/flutter-apk/app-debug.apk
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk

  android-release:
    name: Android Release
    instance_type: mac_mini_m2
    environment:
      flutter: 3.44.7
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: Build Android App Bundle
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
          cd ..
          mkdir -p build/app/outputs/bundle/release
          cp android/app/build/outputs/bundle/release/app-release.aab build/app/outputs/bundle/release/app-release.aab
    artifacts:
      - build/app/outputs/bundle/release/app-release.aab
